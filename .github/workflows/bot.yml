name: Discord Bot Starter

on:
  push:
    branches: [ "main" ] # Startet den Bot neu, wenn du Code hochlädst
  workflow_dispatch:    # Erlaubt es dir, den Bot manuell per Button zu starten

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Code auschecken
      uses: actions/checkout@v4

    - name: Python einrichten
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Abhängigkeiten installieren
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Discord Bot starten
      env:
        # Hier holen wir die geheimen Keys aus den Repository Secrets, die wir angelegt haben!
        DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID }}
      run: python bot.py
