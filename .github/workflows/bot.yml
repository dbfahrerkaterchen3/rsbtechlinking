name: 24/7 Discord Bot

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Code auschecken
      uses: actions/checkout@v4

    - name: Python einrichten
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Abhängigkeiten installieren
      run: |
        python -m pip install --upgrade pip
        pip install discord.py python-dotenv fastapi uvicorn httpx
        sudo npm install -g localtunnel

    - name: Discord Bot & Tunnel starten
      env:
        DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID }}
        DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
      run: |
        # 1. Den Python Bot im Hintergrund starten
        python bot.py &
        sleep 5
        
        # 2. Den Tunnel mit einer FESTEN Subdomain starten
        lt --local-host 127.0.0.1 --port 8000 --subdomain rsbtech-verify > tunnel_url.txt &
        sleep 5
        
        echo "🌐 DEINE FESTE ÖFFENTLICHE URL IST:"
        cat tunnel_url.txt
        
        sleep 18000
