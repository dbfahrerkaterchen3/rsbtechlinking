name: 24/7 Discord Bot

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:      # Garantiert, dass der "Run workflow" Button da ist!

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Code auschecken
      uses: actions/checkout@v4

    - name: Python einrichten
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Abhängigkeiten installieren
      run: |
        python -m pip install --upgrade pip
        pip install discord.py python-dotenv fastapi uvicorn httpx
        sudo npm install -g localtunnel

    - name: Discord Bot & Tunnel starten
      env:
        DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID }}
        DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
      run: |
        # 1. Den Python Bot im Hintergrund starten
        python bot.py &
        
        # 2. 5 Sekunden warten, bis der Bot auf Port 8000 lauscht
        sleep 5
        
        # 3. Den Tunnel direkt auf Localhost (127.0.0.1) ansetzen
        lt --local-host 127.0.0.1 --port 8000 > tunnel_url.txt &
        
        # 4. 5 Sekunden warten, bis localtunnel die URL generiert hat
        sleep 5
        
        echo "🌐 DEINE NEUE ÖFFENTLICHE URL IST:"
        cat tunnel_url.txt
        
        # 5. Wir halten die Action für 5 Stunden aktiv (Maximaler Bot-Betrieb)
        sleep 18000
