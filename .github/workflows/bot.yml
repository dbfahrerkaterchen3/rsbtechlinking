name: 24/7 Discord Bot with Webview


on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
    - name: Code auschecken
      uses: actions/checkout@v4

    - name: Python einrichten
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Abhängigkeiten installieren
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # Installiert ein Tool, das uns eine öffentliche URL schenkt
        sudo npm install -g localtunnel

    - name: Discord Bot & Tunnel starten
      env:
        DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID }}
        DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
      run: |
        # Startet den Tunnel für Port 8000 im Hintergrund und schreibt die URL ins Log
        lt --port 8000 > tunnel_url.txt &
        sleep 5
        echo "🌐 DEINE ÖFFENTLICHE URL IST:"
        cat tunnel_url.txt
        
        # Startet deinen Bot
        python bot.py
